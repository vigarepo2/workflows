name: HF Uploader

on:
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Concurrent tasks: 1 is safest for storage, use 2+ only if runner space is enough"
        required: false
        default: "1"
        type: string
      confirm_rights:
        description: "I confirm I own or have permission to upload all files listed in links.txt"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MAX_WORKERS: ${{ inputs.max_workers }}
      CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TQDM_DISABLE: "1"

    steps:
      - name: Checkout hf-uploader
        uses: actions/checkout@v4
        with:
          ref: hf-uploader

      - name: Validate
        run: |
          if [ "$CONFIRM_RIGHTS" != "true" ]; then
            echo "::error::Confirm permission before running."
            exit 1
          fi
          test -f vars.py || { echo "::error::vars.py missing"; exit 1; }
          test -f links.txt || { echo "::error::links.txt missing"; exit 1; }
          test -n "$HF_TOKEN" || { echo "::error::Add HF_TOKEN in repository secrets"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 unzip p7zip-full || true
          sudo apt-get install -y unrar || sudo apt-get install -y unrar-free || true
          python -m pip install --upgrade pip -q
          python -m pip install huggingface_hub requests tqdm rarfile -q

      - name: Run uploader
        run: python huggingface.py

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-upload-summary
          path: upload_summary.md
          if-no-files-found: ignore
