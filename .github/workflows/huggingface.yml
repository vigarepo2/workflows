name: HF Authorized Uploader
on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Hugging Face repository id"
        required: true
        type: string
      path_in_repo:
        description: "Folder inside the Hugging Face repo"
        required: false
        default: "uploads"
        type: string
      hf_branch:
        description: "Target Hugging Face branch"
        required: false
        default: "main"
        type: string
      repo_type:
        description: "model, dataset, or space"
        required: false
        default: "model"
        type: string
      source_links:
        description: "One URL per line. Supports: URL, URL -n filename.ext, URL -unzip"
        required: true
        type: string
      max_workers:
        description: "Parallel jobs, 1-10"
        required: false
        default: "4"
        type: string
      confirm_rights:
        description: "Confirm you own or have permission to upload these files"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      REPO_ID: ${{ inputs.repo_id }}
      PATH_IN_REPO: ${{ inputs.path_in_repo }}
      BRANCH: ${{ inputs.hf_branch }}
      REPO_TYPE: ${{ inputs.repo_type }}
      MAX_WORKERS: ${{ inputs.max_workers }}
      LINKS_FILE: links.txt
      CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: |
          if [ "$CONFIRM_RIGHTS" != "true" ]; then
            echo "::error::Confirm you have permission to upload every listed file."
            exit 1
          fi
          if [ -z "$HF_WRITE_TOKEN" ]; then
            echo "::error::Add HF_WRITE_TOKEN in GitHub repository secrets."
            exit 1
          fi

      - name: Write links.txt
        env:
          SOURCE_LINKS: ${{ inputs.source_links }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text = os.environ.get("SOURCE_LINKS", "").strip()
          if "\\n" in text and "\n" not in text:
              text = text.replace("\\n", "\n")
          Path("links.txt").write_text(text + "\n", encoding="utf-8")
          print("links.txt ready")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 unzip p7zip-full || true
          sudo apt-get install -y unrar || sudo apt-get install -y unrar-free || true
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub requests tqdm rarfile

      - name: Run uploader
        run: python huggingface.py

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-upload-summary
          path: upload_summary.md
          if-no-files-found: ignore
