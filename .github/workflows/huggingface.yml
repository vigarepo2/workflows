name: HuggingFace Uploader

on:
  workflow_dispatch:
    inputs:
      source_links:
        description: "One link per line. Supports: URL, URL -n filename.ext, URL -unzip"
        required: true
        type: string
      max_workers:
        description: "Parallel jobs from 1 to 10"
        required: false
        default: "4"
        type: string
      confirm_rights:
        description: "Required: I confirm I have rights to every file in source_links."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      REPO_ID: DevDoCode/DDL2
      PATH_IN_REPO: cdn/movies
      BRANCH: movies
      REPO_TYPE: model
      LINKS_FILE: links.txt
      MAX_WORKERS: ${{ inputs.max_workers }}
      CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hf-uploader

      - name: Validate
        run: |
          if [ "$CONFIRM_RIGHTS" != "true" ]; then
            echo "::error::Confirm you own or have permission to upload every listed file."
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add HF_TOKEN in GitHub repository secrets."
            exit 1
          fi

      - name: Write links.txt
        env:
          SOURCE_LINKS: ${{ inputs.source_links }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text = os.environ.get("SOURCE_LINKS", "").strip()
          if "\\n" in text and "\n" not in text:
              text = text.replace("\\n", "\n")
          Path("links.txt").write_text(text + "\n", encoding="utf-8")
          print("links.txt ready")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 unzip p7zip-full || true
          sudo apt-get install -y unrar || sudo apt-get install -y unrar-free || true
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub requests tqdm rarfile

      - name: Run uploader
        run: python huggingface.py

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-upload-summary
          path: upload_summary.md
          if-no-files-found: ignore
